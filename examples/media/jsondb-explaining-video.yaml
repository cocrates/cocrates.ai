type: video
model: gemini-omni-flash-preview

params:
  prompt: |
    <FIRST_FRAME> Turn this into realistic footage. A person in a hoodie stands beside a large TV screen, gesturing toward the screen with their right hand while explaining something to 2-3 friends seated on a couch. The friends nod and lean forward attentively.

    The person points at different sections of the architecture diagram on the TV — first at the left side (agents), then moves their hand toward the center (server/goroutines), then to the right (engines and storage). Their mouth moves naturally as if speaking.

    The camera slowly dollies in from a wide shot to a medium shot, focusing on the explainer and the TV screen. Subtle ambient movement: one friend scratches their chin thoughtfully, another picks up a coffee mug.

    Warm indoor lighting, soft shadows. Sound design: calm male voice narrating in Korean explaining the jsondb concurrent processing architecture, with subtle room ambience. No background music.
  images:
    - path: "./jsondb-explaining-friends.png"
  durationSeconds: 8
  aspectRatio: "16:9"
  task: image_to_video
  seed: null

output: "./jsondb-explaining-video.mp4"
