title: jsondb 동시 요청 병렬 처리
backend: excalidraw

summary: |
  에이전트와 CLI 사용자가 동시에 jsondb에 요청할 때,
  파일별 독립 Engine과 잠금 메커니즘으로 병렬 처리와 데이터 무결성이 보장된다.

explanation: |
  왼쪽의 요청 소스들을 보면, Agent 1, Agent 2가 동시에 요청을 보낸다.
  사용자는 CLI를 통해 요청을 보내며, CLI는 내부적으로 모든 명령을 HTTP 요청으로 변환하므로 에이전트와 동일한 경로로 처리된다.

  중앙의 Go HTTP 서버는 들어오는 각 요청마다 별도의 goroutine을 생성하여 병렬로 처리한다.
  goroutine은 독립적으로 실행되므로, 한 요청이 대기 중이어도 다른 요청에 영향을 주지 않는다.

  서버 내부에는 파일별로 독립적인 Engine 인스턴스가 존재한다.
  같은 파일에 대한 요청은 하나의 Engine을 공유하고, 다른 파일에 대한 요청은 완전히 독립된다.

  각 Engine 앞에 Read/Write Lock이 있다.
  읽기 요청은 서로 병렬로 처리되고, 쓰기 요청은 해당 파일의 모든 접근이 끝날 때까지 대기한다.

  이 구조로 에이전트와 CLI 사용자는 서로 다른 파일에 대해 완전히 병렬로 작업하고,
  같은 파일에 대해서는 안전하게 협업한다.
  
  오른쪽의 Storage는 파일 A와 파일 B를 포함하는 저장소 영역을 나타낸다.

output: "./jsondb-architecture.excalidraw"

