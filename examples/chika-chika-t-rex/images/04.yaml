  - 충균 몬스터 (state: big, shrinking) — 오른쪽, 이전보다 살짝 작아짐, 움츠린 표정
    (참조: 충균-몬스터-big.png)
  - 칫솔 검의 좌우 궤적이 흔적처럼 표현됨
  - 수채화 디지털 페인팅
  - 텍스트:
    (액션 효과음, 중앙, 큰 글씨) "앞뒤로도 — 치카치카!"
    (대사, 오른쪽, 몬스터, 굵게) "히이이! 멈춰!"
    (괄호 내레이션, 작게, 오른쪽 아래) "(벌써 조금 작아졌네?)"

