title: 치카치카 대모험 / Page 04
message: |
  두 번째 공격! 티라노가 칫솔 검을 앞뒤로 휘두르며 몬스터를 공격한다.
  몬스터가 움츠리며 벌써 조금 작아지기 시작했다.

design: |
  그림책 페이지. 세로형 3:4.
  - 장소: 이빨 성 앞마당 — 이빨성-앞마당 / 성문-뷰 (오염 상태)
    (참조: 치카치카-왕국-이빨성-앞마당-성문-뷰-오염.png)
