title: 치카치카 대모험 / Page 06 (클라이맥스)
message: |
  꼼꼼히 닦은 결과, 충균 몬스터가 발목 높이까지 조그마하게 줄어들었다!
  티라노의 승리. 성이 거의 깨끗해지고 반짝이기 시작한다. 클라이맥스 장면.

design: |
  그림책 페이지. 세로형 3:4. 클라이맥스.
  - 장소: 이빨 성 앞마당 — 이빨성-앞마당 / 성문-뷰 (회복 상태)
    (참조: 치카치카-왕국-이빨성-앞마당-성문-뷰-회복.png)
  - 티라노 (state: t-rex) — 중앙, 당당하게 칫솔 검을 어깨에 메고 자신만만한 포즈
    (참조: 티라노-t-rex.png)
  - 충균 몬스터 (state: small) — 티라노 발목 높이, 울먹이는 표정
    (참조: 충균-몬스터-small.png)
  - 크기 대비 강조 (티라노는 크게, 몬스터는 아주 작게)
  - 성이 반짝이기 시작, 하늘이 맑아짐
  - 수채화 디지털 페인팅
  - 텍스트:
    (내레이션, 상단, 부드럽게) "꼼꼼히 닦았더니..."
    (대사, 아래, 몬스터, 작고 울먹이는 느낌) "으으... 너무 닦여버렸잖아..."
    (괄호, 몬스터 옆, 작게) "(조그마하게!)"
    (대사, 중앙, 티라노, 가장 크게+굵게+글로우) "치카치카 티라노의 승리!"

