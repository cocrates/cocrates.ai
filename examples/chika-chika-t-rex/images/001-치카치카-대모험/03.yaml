    돌진하는 자세 (참조: 티라노-t-rex.png)
  - 충균 몬스터 (state: big) — 오른쪽, 맞고 움찔하는 표정 (참조: 충균-몬스터-big.png)
  - 칫솔 검에서 하얀/파란 치약 거품 광선이 몬스터를 향함
  - 액션 속도감, 역동적인 구도
  - 수채화 디지털 페인팅
  - 텍스트:
    (대사, 왼쪽, 티라노, 굵게) "칫솔 검, 준비 완료!"
    (액션 효과음, 큰 글씨, 중앙) "위아래로 — 치카치카!"
    (대사, 오른쪽, 몬스터, 굵게+글로우) "아야야! 뭐야 그거!"

