title: 치카치카 대모험 / Page 03
message: |
  티라노가 칫솔 검을 꺼내 몬스터를 향해 위아래로 휘두른다. 칫솔 검에서
  치약 거품 광선이 나와 몬스터를 때린다. 첫 번째 공격! 액션 장면.

