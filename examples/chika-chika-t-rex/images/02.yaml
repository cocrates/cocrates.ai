title: 치카치카 대모험 / Page 02
message: |
  티라노가 치카치카 왕국에 도착했다. 그런데 아름다운 이빨 성이 충균
  몬스터에게 더럽혀져 있다. 몬스터가 성 위에서 깔깔대고 있다. 위기감!

design: |
  그림책 페이지. 세로형 3:4.
  - 장소: 치카치카 왕국 입구 — 칫솔숲-입구 / 성-전망 (오염 상태)
    (참조: 치카치카-왕국-칫솔숲-입구-성-전망-오염.png)
  - 티라노 (state: t-rex) — 왼쪽 아래, 깜짝 놀란 표정, 칫솔 검을 쥐고 성을 올려다봄
    (참조: 티라노-t-rex.png)
  - 충균 몬스터 (state: big) — 성 위에 올라가 깔깔 웃음, 보라색 통통 몸, 외눈박이
    (참조: 충균-몬스터-big.png)
  - 성이 보라색/검은색으로 오염됨, 하늘 부분적으로 흐림
  - 수채화 디지털 페인팅
  - 텍스트:
    (대사, 왼쪽 아래, 티라노) "어?! 누가 우리 치카치카 왕국을 이렇게 만들었어?"
    (대사, 성 위, 몬스터, 가장 크게+굵게) "히히히! 내가 다 더럽혀 주겠어!"

