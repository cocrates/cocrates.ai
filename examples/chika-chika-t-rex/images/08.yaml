title: 치카치카 대모험 / Page 08
message: |
  치카치카 왕국이 완전히 되살아났다! 이빨 성이 반짝이고 하늘에 무지개.
  왕국의 작은 요정들이 나타나 환호한다. 티라노가 성 앞에서 미소 짓는다.
  축제 분위기!

design: |
  그림책 페이지. 세로형 3:4.
  - 장소: 이빨 성 앞마당 — 이빨성-앞마당 / 성문-뷰 (회복 상태, 더욱 화려하게)
    (참조: 치카치카-왕국-이빨성-앞마당-성문-뷰-회복.png)
  - 티라노 (state: t-rex) — 중앙, 칫솔 검을 하늘로 들어 올리며 행복한 미소
    (참조: 티라노-t-rex.png)
  - 작은 칫솔 요정들 (반짝이는 작은 빛/별 모양)이 곳곳에서 환호
  - 무지개, 반짝이는 파티클, 축제 분위기
  - 수채화 디지털 페인팅
  - 텍스트:
    (내레이션, 상단, 부드럽게) "반짝반짝 —"
    (내레이션, 중앙) "치카치카 왕국이 되살아났다!"
    (환호, 아래, 가장 크게+굵게+노랑 글로우) ""만세! 치카치카 티라노 만세!""

