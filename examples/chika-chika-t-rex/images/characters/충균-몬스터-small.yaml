    one large yellow eye in the center of its face, small mouth with a
    trembling lower lip, a tear drop on its cheek. Short stubby arms raised
    in surrender. No green slime. Pathetic and cute expression. Clean white
    background, watercolor digital painting style, soft outlines. Full body,
    front view.
  size: 1K
  aspectRatio: "1:1"
