    Children's picture book page. Portrait 3:4.
    SETTING: Using Image 1 as reference — the front courtyard of Tooth Castle.
    The pollution is starting to recede slightly — some of the purple stains
    are fading, a hint of sparkle returning.
    CHARACTERS: Using Image 2 as reference — the cute green T-rex hero at
    left, focused expression, carefully moving the toothbrush-sword in small
    precise motions with swirling lines around it.
    Using Image 3 — the purple cavity monster now at knee-height (small state),
    same round body and single eye but much smaller, laughing with arms
    flopping, tears of laughter.
    Watercolor digital painting, soft pastel tones.
    TEXT OVERLAY:
    1. Center, large bold blue-toned action sound effect:
    "안쪽까지 — 샥샥!"
    2. Right side, by the tiny monster, bold font in purple tone:
    "하하하! 간지러워!!!"
    3. Bottom-right corner, small narration in parentheses:
    "(점점 작아지고 있어!)"
    Do not obscure character faces.
  images:
    - path: "./locations/치카치카-왕국-이빨성-앞마당-성문-뷰-오염.png"
    - path: "./characters/티라노-t-rex.png"
    - path: "./characters/충균-몬스터-small.png"
