title: Clip 09 — 치카치카 티라노의 승리!
message: |
  이전 클립의 간지러운 웃음에서 울먹임으로 전환. 몬스터가 발목 높이로
  작아져 울먹이고, 티라노가 당당히 승리. 클립 끝에서 승리의 분위기가
  다음 클립(헹굼 마무리)으로 이어짐.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 이전 클립 끝의 분위기가 자연스럽게 이어짐 — 몬스터의 울먹임.
  모션: 티라노가 당당한 포즈, 칫솔 검을 어깨에 메고 승리의 미소.
  몬스터가 발목 높이에서 울먹임. 성이 반짝이기 시작.
  클립 끝: 티라노가 칫솔 검을 다시 들어 올리며 — 다음 클립(헹굼 동작)의
  시작 자세를 취함. 승리의 여운이 마무리 액션으로 연결.
  오디오: 충균 몬스터 "으으... 너무 닦여버렸잖아..." 울먹이는 코믹 톤.
  엄마(내레이터) "치카치카 티라노의 승리!" 당당하고 뿌듯한 톤.
  승리의 팡파르 효과음.
  BGM: 승리의 웅장한 테마 — 메인 테마의 승리 버전. 클립 끝에서 살짝
  에너지가 줄며 다음 클립(마무리 동작)을 준비. 8초, 16:9.

