title: Clip 11 — 반짝이는 왕국
message: |
  이전 클립의 깨끗해진 성에서 이어져 환호와 축제 분위기. 왕국이 완전히
  회복되고 무지개가 뜸. 티라노가 행복한 미소. 클립 끝에서 왕국이
  서서히 흐려지며 다음 클립(현실 복귀)로 전환 준비.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 이전 클립의 깨끗해진 성과 같은 장소 — 이제 축제 분위기로 전환.
  모션: 왕국이 반짝이고 무지개가 떠오름. 티라노가 칫솔 검을 들어 올리며
  환한 미소. 작은 반짝임과 환호하는 분위기.
  클립 끝: 화면이 서서히 흐려지며 페이드 아웃 준비 — 다음 클립(현실 화장실)으로
  전환. 현실로 돌아갈 것을 암시하는 잔잔해지는 분위기.
  오디오: 엄마(내레이터) "반짝반짝 — 치카치카 왕국이 되살아났다!"
  감동적이고 따뜻한 톤. 이어서 여러 목소리 환호 "만세! 치카치카 티라노 만세!"
  반짝임 효과음 + 환호성.
  BGM: 따뜻한 승리/축제 테마 — 메인 테마의 축제 버전. 클립 끝에서 서서히
  잔잔해지며 포근한 엔딩 분위기로 전환. 8초, 16:9.

