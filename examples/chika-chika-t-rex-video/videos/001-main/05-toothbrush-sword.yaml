title: Clip 05 — 칫솔 검, 준비 완료!
message: |
  이전 클립의 몬스터 웃음에 이어 티라노의 결의에 찬 반응. 칫솔 검을 꺼내
  높이 들며 액션의 시작을 알림. 클립 끝에서 검을 든 포즈가 다음 클립(첫 공격)의
  출발점이 됨.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 몬스터의 웃음에 반응하듯 티라노의 결의에 찬 표정으로 컷 전환.
  모션: 티라노가 칫솔 검을 높이 치켜듦. 칫솔 검이 반짝임. 자신만만한 표정.
  카메라 약간 로우 앵글. 검에서 빛나는 효과.
  클립 끝: 칫솔 검을 든 자세 그대로 — 다음 클립(위아래 휘두름)의 시작 동작으로
  자연스럽게 이어짐. 마치 바로 다음 동작으로 넘어갈 것 같은 느낌.
  오디오: 주인공(티라노) "칫솔 검, 준비 완료!" 당차고 자신감 있는 톤.
  칼집에서 빼는 듯한 효과음 + 반짝임.
  BGM: 이전 클립의 드럼 비트가 액션 테마로 전환. 에너지가 차오르는 느낌.
  클립 끝에서 스네어 드럼 롤이 다음 액션을 예고. 8초, 16:9.

# --- cocrates-google-genai ---
