title: Clip 08 — 안쪽까지 샥샥!
message: |
  이전 클립의 연속 액션 — 더 섬세해진 움직임. 몬스터 구석구석을 닦아냄.
  몬스터가 간지러워 웃음. 몬스터가 더 작아짐. 클립 끝에서 간지러운 웃음이
  울먹임으로 바뀌며 다음 클립(클라이맥스/울먹이는 몬스터)으로 감정 전환.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 이전 클립의 좌우 운동에서 섬세한 움직임으로 자연스럽게 전이.
  모션: 티라노가 집중하는 표정으로 칫솔 검을 섬세하게 조종. 작은 광선들이
  몬스터 주변을 감쌈. 몬스터가 간지러워하며 웃고 발버둥.
  클립 끝: 몬스터의 표정이 웃음에서 울먹임으로 변화하기 시작 —
  다음 클립(울먹이는 몬스터 + 승리)의 분위기를 준비.
  오디오: 엄마(내레이터) "안쪽까지 — 샥샥!" 경쾌한 톤.
  충균 몬스터 "하하하! 간지러워!!!" 웃음 섞인 코믹 톤.
  간지러움 효과음.
  BGM: 액션 테마에서 점점 코믹한 변주로 변화 — 몬스터의 간지러운 반응에 맞춤.
  클립 끝에서 BGM이 승리 모드로 전환 준비. 10초, 16:9.

