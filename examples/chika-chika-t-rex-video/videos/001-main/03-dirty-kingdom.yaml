title: Clip 03 — 더러워진 왕국
message: |
  이전 클립의 불안한 분위기에서 이어짐. 치카치카 왕국에 도착한 티라노,
  더러워진 성을 발견하고 놀람. 클립 끝에서 시선이 성 위로 향하며
  다음 클립(몬스터 등장)으로 연결.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 이전 클립의 불안한 분위기가 그대로 이어짐.
  모션: 티라노가 고개를 들어 더러워진 성을 올려다봄. 표정이 놀람→당황으로 변화.
  카메라가 천천히 위로 팬되며 성 위쪽을 보여줌.
  클립 끝: 카메라가 성 위로 계속 이동하며 — 다음 클립(몬스터 등장)으로 시선 연결.
  오디오: 주인공(티라노) "어?! 누가 우리 치카치카 왕국을 이렇게 만들었어?"
  놀라고 당황한 톤. 불길한 저음 효과음.
  BGM: 이전 클립의 불안한 분위기를 그대로 이어받아 긴장감/위기감 조성.
  클립 끝에서 악당 테마를 암시하는 음향이 살짝 등장. 8초, 16:9.

