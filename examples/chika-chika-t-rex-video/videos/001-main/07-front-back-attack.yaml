title: Clip 07 — 앞뒤로도 치카치카!
message: |
  이전 클립의 연속 액션. 칫솔 검을 앞뒤로 휘두르며 몬스터를 문지름.
  몬스터가 작아지기 시작. 액션이 효과를 보고 있음. 클립 끝에서 계속해서
  다음 클립(안쪽 공격)으로 액션 흐름 유지.

design: |
  단일 연속 샷. 참조 이미지를 첫 프레임으로 사용.
  시작: 이전 클립의 검을 든 자세에서 좌우 휘두름으로 자연스럽게 이어짐.
  모션: 티라노가 칫솔 검을 좌우로 흔드는 동작. 움직임 궤적 표현.
  몬스터가 이전보다 약간 작아짐. 움츠린 표정.
  클립 끝: 티라노의 움직임이 더 섬세해지며 — 다음 클립(안쪽 구석구석)으로 연결.
  액션의 흐름 유지.
  오디오: 엄마(내레이터) "앞뒤로도 — 치카치카!" 신난 톤.
  충균 몬스터 "히이이! 멈춰!" 당황한 코믹 톤.
  칫솔 검 휘두름 효과음.
  BGM: 이전 클립에서 이어지는 액션 테마 — 연속감 유지. 박진감 지속.
  BGM이 끊기지 않고 다음 클립으로 계속. 10초, 16:9.

