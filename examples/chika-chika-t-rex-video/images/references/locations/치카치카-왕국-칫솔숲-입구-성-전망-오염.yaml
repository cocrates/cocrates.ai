  - 칫솔 모양의 나무들이 늘어선 길 (나무 줄기는 칫솔 손잡이, 잎은 칫솔모)
  - 바닥은 부드러운 치약 거품으로 덮여 있음
  - 멀리 거대한 이빨 모양의 하얀 성 (여러 개의 이빨 탑)
  - 성과 주변이 보라색/검은색 끈적한 오염 물질로 더럽혀짐
  - 하늘이 부분적으로 흐림
  - 반짝이는 효과가 사라지고 어두운 느낌
  - 수채화 디지털 페인팅, 밝은 파스텔 톤 (오염 제외)
  - 사람/캐릭터 없음
