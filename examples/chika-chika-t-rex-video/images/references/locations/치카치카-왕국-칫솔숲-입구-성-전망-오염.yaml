title: 치카치카 왕국 / 칫솔숲-입구 / 성-전망 (오염) 장소 참조 이미지
message: |
  치카치카 왕국의 입구. 칫솔 나무 숲을 지나 이빨 모양 성으로 이어지는 길.
  하지만 성과 주변이 충균 몬스터에게 더럽혀져 보라색과 검은색으로 얼룩짐.

