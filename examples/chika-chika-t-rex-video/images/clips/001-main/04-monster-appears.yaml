title: Clip 04 — 충균 몬스터 등장
message: |
  충균 몬스터가 성 위에서 나타난다. 자신만만하게 깔깔대며 왕국을 더럽힌 것이
  자신이라고 자랑한다. 악당의 정체가 드러나는 순간.

design: |
  영상 클립 키 이미지. 16:9 와이드.
  - 장소: 이빨 성 앞마당. 성이 보라색/검은색으로 오염됨.
  - 충균 몬스터 (big 상태): 둥글고 통통한 보라색 몸체, 큰 외눈박이 하나.
    티라노보다 1.5배 큰 크기. 성 위에 올라서서 활짝 웃으며 양팔을 벌린
    건방지고 자신만만한 포즈.
  - 티라노 (t-rex): 아래에서 몬스터를 올려다보며 경계하는 표정.
  - 수채화 디지털 페인팅, 파스텔 톤
  - 참조: 티라노-t-rex.png, 충균-몬스터-big.png

