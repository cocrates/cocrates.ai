title: Clip 02 — 치카치카 티라노!
message: |
  변신! 꼬마가 초록색 티라노사우루스로 변신한다. 놀라면서도 신난 표정.
  치카치카 왕국이 배경으로 펼쳐지며 모험의 시작을 알린다.

design: |
  영상 클립 키 이미지. 16:9 와이드.
  - 배경: 치카치카 왕국 — 칫솔 숲과 반짝이는 이빨 성 (깨끗한 상태). 맑은 하늘.
  - 티라노 (t-rex 상태): 초록 몸, 하얀 배, 커다란 검은 눈+속눈썹, 이마 검정 깃,
    노란 배 무늬. 두 팔을 벌린 포효하는 포즈. 신나고 당당한 표정. 칫솔 검 없음.
  - 변신 순간의 반짝이는 폭죽/빛 효과가 주변에 퍼짐. 마법 같은 분위기.
  - 수채화 디지털 페인팅, 따뜻하고 밝은 파스텔 톤
  - 참조: 티라노-t-rex.png (캐릭터)

# --- cocrates-google-genai ---
type: image
model: gemini-3.1-flash-image
params:
  prompt: |
    Widescreen 16:9 scene for a children's picture book video.
    BACKGROUND: A bright fantasy kingdom — Chika-Chika Kingdom. A path through
    colorful toothbrush trees leads to a sparkling white castle shaped like a
    giant molar tooth. Clear blue sky, warm sunlight. Watercolor style.
    CHARACTER: Using Image 1 as reference — the cute cartoon T-rex with bright
    green skin, white belly, large dark eyes with long eyelashes, small black
    crest on forehead, yellow markings on belly and tail. Arms spread wide in a
    roaring pose, excited and confident expression. No toothbrush sword yet.
    SURROUNDINGS: Sparkling magical light effects burst around the T-rex as if
    he just transformed — bright sparkles and gentle glowing particles.
    Warm pastel tones, digital watercolor painting style. No text.
  references:
    - path: "../../../images/references/characters/티라노-t-rex.png"
  size: 1K
  aspectRatio: "16:9"
  seed: null
