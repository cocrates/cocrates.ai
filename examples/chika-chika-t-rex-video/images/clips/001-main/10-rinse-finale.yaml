title: Clip 10 — 물로 입안을 헹궈라!
message: |
  마무리 동작. 티라노가 칫솔 검을 크게 휘둘러 치약 거품을 쓸어낸다.
  물과 거품의 소용돌이가 몬스터를 휩쓸어 사라지게 한다. 성이 완전히 깨끗해진다.

design: |
  영상 클립 키 이미지. 16:9 와이드.
  - 장소: 이빨 성 앞마당 (완전 회복).
  - 티라노 (t-rex 상태): 칫솔 검을 크게 휘두르는 마무리 동작. 칫솔 검에서
    물결/거품 소용돌이가 휘몰아침.
  - 충균 몬스터 (small 상태): 거품 소용돌이에 휩쓸려 허둥대는 모습.
    놀라고 당황한 표정.
  - 배경: 성이 완전히 깨끗해짐. 하늘이 다시 맑아짐.
  - 수채화 디지털 페인팅, 파스텔 톤
  - 참조: 티라노-t-rex.png, 충균-몬스터-small.png

# --- cocrates-google-genai ---
