title: Clip 09 — 치카치카 티라노의 승리!
message: |
  클라이맥스. 꼼꼼히 닦은 덕분에 충균 몬스터가 티라노의 발목 높이만큼
  조그마하게 줄어들었다. 티라노가 당당히 칫솔 검을 어깨에 메고 서 있다.
  성의 더러움도 거의 다 사라졌다. 승리의 순간!

design: |
  영상 클립 키 이미지. 16:9 와이드.
  - 장소: 이빨 성 앞마당 (거의 완전 회복, 반짝이기 시작).
  - 티라노 (t-rex 상태): 당당하고 자신만만한 포즈. 칫솔 검을 어깨에 메고 있음.
    승리의 미소.
  - 충균 몬스터 (small 상태): 발목 높이의 조그만 몬스터. 울먹이는 표정.
    두 팔을 들고 "으으..." 하는 모습.
  - 크기 대비 강조 — 티라노는 크게, 몬스터는 작게.
  - 성이 반짝이기 시작하는 효과
  - 수채화 디지털 페인팅, 따뜻한 파스텔 톤
  - 참조: 티라노-t-rex.png, 충균-몬스터-small.png

